<!-- Slots: title, badge, placeholder, label-latitude, label-longitude, label-auto-follow, label-view -->
<template id="geo-location-template">
    <div class="card" part="card">
        <div class="card-header" part="header">
            <h2 part="title">
                <span class="pin-badge" part="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21Z"></path>
                        <circle cx="12" cy="10.5" r="2.5"></circle>
                    </svg>
                </span>
                <slot name="title">Geolocation</slot>
            </h2>
            <span class="badge" part="badge">
                <span class="badge-dot" aria-hidden="true"></span>
                <slot name="badge">GPS Ready</slot>
            </span>
        </div>

        <div class="map" id="map-wrapper" part="map">
            <iframe id="map" part="map-iframe" title="Mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <div class="placeholder" part="placeholder">
                <p class="placeholder-text"><slot name="placeholder">Pulsa «Ver» para cargar tu ubicación en el mapa</slot></p>
            </div>
        </div>

        <div class="coords" part="coords">
            <div class="input-group" part="field">
                <label part="label" for="latitude"><slot name="label-latitude">Latitud</slot></label>
                <input part="input" id="latitude" name="latitude" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. 10.6427">
            </div>
            <div class="input-group" part="field">
                <label part="label" for="longitude"><slot name="label-longitude">Longitud</slot></label>
                <input part="input" id="longitude" name="longitude" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. -71.6125">
            </div>
        </div>

        <label class="toggle-row" part="toggle" for="auto-follow">
            <span class="toggle-label"><slot name="label-auto-follow">Seguir mi ubicación automáticamente</slot></span>
            <span class="switch" part="switch">
                <input type="checkbox" id="auto-follow" part="checkbox">
                <span class="slider" part="slider" aria-hidden="true"></span>
            </span>
        </label>

        <button id="view" class="btn" part="button" type="button">
            <svg part="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="7"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
            </svg>
            <slot name="label-view">Ver ubicación</slot>
        </button>

        <p class="status" id="status" part="status" role="status">Obteniendo ubicación…</p>
    </div>
</template>
